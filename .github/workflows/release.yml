name: Release

# On every push to main, release-please keeps a "chore(release): release x.y.z" PR
# up to date from the Conventional Commits since the last release. Merging that
# PR tags the release (vX.Y.Z) and creates the GitHub Release with the changelog.
#
# Publishing `oxido` (crates.io for `cargo install`, and prebuilt binaries built
# with cargo-dist for `cargo binstall`) is added in platform phase P11; see
# docs/release.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # A PAT or app token lets the release PR trigger CI and the Claude review;
          # PRs opened with the default GITHUB_TOKEN don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
