name: Claude Code Review

# Every non-draft PR gets a review from Claude. Make the "Claude review" check
# required in the rulesets for develop and main so nothing merges without it.
# Auth: set ONE of the secrets CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY
# (`claude /install-github-app` sets this up). See docs/workflows.md.
#
# PRs from forks and from Dependabot don't receive the repository's secrets, so
# the review can't run there. The job is skipped for them instead of failing,
# and GitHub counts a skipped job as passed for a required check. A maintainer
# can still ask for a review by commenting "@claude review this PR" (claude.yml).
# To review Dependabot PRs automatically too, add the same secret under
# Settings > Secrets and variables > Dependabot and drop the Dependabot line below.
#
# PRs from develop into main are skipped too: they only carry PRs that were
# already reviewed. The job fails when Claude finishes without posting a
# verdict, for example when no secret is set, except on a PR that changes this
# file, which claude-code-action refuses to review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.head_ref != 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Note the start time
        run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out; use
            gh pr diff for the diff, since git can't see the base branch here.
            Read CLAUDE.md first, then docs/testing.md and docs/conventions.md.

            Check, in this order:
            1. Correctness: bugs, edge cases, error handling, panics in Rust code.
            2. Tests: every behavior change comes with tests, written first (TDD).
               Flag behavior changes without a test that would have failed before.
            3. Security: oxido's host, session and origin checks (CLAUDE.md rule 5),
               anything that runs cargo or student code, anything that fetches
               remote content.
            4. Performance: the app must stay light (no heavy dependency without a reason,
               lazy-load the editor and the video player).
            5. Course rules, when content/ or course/ changed: a text lesson covers
               every point of its outline in content/outlines/ (the video's points, in
               order) in the same order, without silent corrections, and never copies
               transcripts; translations change prose and comments only and use the
               glossary's terms.
            6. Conventions: Conventional Commits title with a valid scope, docs updated
               when behavior or structure changed.

            Post specific issues as inline comments. Finish with one top-level comment
            (gh pr comment) that lists blocking issues first, then suggestions, then
            a last line that starts with `Verdict:`. Only post GitHub comments; don't
            reply with plain messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Check that Claude posted a verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # claude-code-action only runs when this file matches the copy on the
          # default branch, so a PR that changes it can't be reviewed.
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -qx '.github/workflows/claude-review.yml'; then
            echo "::notice::This PR changes claude-review.yml, so Claude can't review it. Review it by hand."
            exit 0
          fi
          verdicts=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select((.user.login | startswith("claude")) and .updated_at >= env.STARTED and (.body | contains("Verdict:"))) | .id' | wc -l)
          if [ "$verdicts" -eq 0 ]; then
            echo "::error::Claude finished without posting a verdict. Check that CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, then re-run this job."
            exit 1
          fi
