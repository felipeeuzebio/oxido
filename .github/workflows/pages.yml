name: Website (GitHub Pages)

# Publishes the hosted version of the app: lessons, videos and quizzes, with
# progress kept in the browser. In repo Settings > Pages, set Source to
# "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "content/**"
      - "crates/oxido-content/**"
      - "crates/xtask/**"
      - ".cargo/**"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pages serves the site from /<repo-name>/
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # `bun run build` compiles the course first, with `cargo xtask content`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      # React Router writes pre-rendered pages under web/build/client/<repo>/ and
      # shared files at web/build/client/. Pages needs them in one folder, with the
      # single-page-app fallback as 404.html for every other path.
      - name: Assemble the site
        run: |
          repo="${BASE_PATH#/}"
          mkdir site
          cp -r "web/build/client/$repo/." site/
          cp -r web/build/client/assets site/assets
          # Top-level files from web/public/ (favicon, logos, icons)
          find web/build/client -maxdepth 1 -type f ! -name '*.html' -exec cp {} site/ \;
          cp web/build/client/index.html site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
