name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # PRs into develop are squash-merged, so the title becomes the commit
      # that release-please reads.
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | bunx commitlint

  web:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # `bun run build` compiles the course first, with `cargo xtask content`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run check
      - run: bun run test
      - run: bun run build

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      # The course itself: content/ passes every check of the content compiler,
      # and every `rust` block in the lessons builds (or fails) as marked.
      - run: cargo xtask content --out target/content-check
      - run: cargo xtask check-code

  msrv:
    name: Rust minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-version in Cargo.toml is the oldest Rust that `cargo install`
      # promises to build oxido with. Dependabot doesn't know it, so this job
      # is what catches an update (or new code) that needs a newer Rust.
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (stable) for every step.
      - name: Use the rust-version from Cargo.toml
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    env:
      # cargo-deny's Linux binary from its GitHub release. Its action builds a
      # Docker image from Docker Hub instead, which fails whenever the shared
      # runner has hit Docker Hub's pull limit. Dependabot doesn't update
      # these: bump both together, the hash from the release's .sha256 file.
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # Security advisories, licenses, banned or duplicate crates and sources,
      # as set in deny.toml. The same command the action ran.
      - run: cargo deny --log-level warn --all-features check

  e2e:
    name: End to end (Playwright against oxido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Playwright is a dependency of the web/ workspace, so install its browser from there.
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      # Builds the frontend, then runs `oxido serve` on port 4173 (web/playwright.config.ts).
      - run: bun run test:e2e
